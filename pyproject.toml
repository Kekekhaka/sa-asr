[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sa-asr"
version = "0.1.0"
description = "Multilingual speech-to-text for South African languages (Whisper fine-tuning)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.56",
    "datasets>=3.0",
    "huggingface_hub>=0.25",
    "peft>=0.13",
    "accelerate>=1.0",
    "jiwer>=3.0",
    "soundfile>=0.12",
    "soxr>=0.3",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "tabulate>=0.9",
    "truststore>=0.9",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
app = ["streamlit>=1.40", "sentencepiece>=0.2"]  # sentencepiece: the Tshivenda translation model's tokenizer

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
